<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Calculadora Java Web</title>

    <link rel="stylesheet"
          href="CSS/style.css">

</head>

<body>

    <main class="calculadora">

        <h1>Calculadora</h1>

        <div class="campo">

            <label for="numero1">
                Primeiro número
            </label>

            <input
                type="number"
                id="numero1"
                step="any"
                placeholder="Digite um número">

        </div>


        <div class="campo">

            <label for="operacao">
                Operação
            </label>

            <select id="operacao">

                <option value="+">Somar (+)</option>

                <option value="-">Subtrair (-)</option>

                <option value="*">
                    Multiplicar (×)
                </option>

                <option value="/">
                    Dividir (÷)
                </option>

            </select>

        </div>


        <div class="campo">

            <label for="numero2">
                Segundo número
            </label>

            <input
                type="number"
                id="numero2"
                step="any"
                placeholder="Digite um número">

        </div>


        <button id="btnCalcular">
            Calcular
        </button>


        <div id="resultado"
             class="resultado">

            Resultado aparecerá aqui.

        </div>

    </main>


    <script src="JS/app.js"></script>

</body>

</html>
